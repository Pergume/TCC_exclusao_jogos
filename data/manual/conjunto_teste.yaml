# Conjunto de teste: pares de pedidos com e sem restrição de exclusão.
#
# Estrutura de cada par:
#   id:          identificador estável (prefixo = tipo de restrição)
#   tipo:        estilo_visual | dificuldade | modo_de_jogo | tema | titulo_referencia
#   com / sem:   o mesmo pedido com e sem a exclusão
#   referencia:  jogo citado no pedido (removido dos rankings na avaliação)
#   positivo:    lista de grupos de tags; o jogo precisa satisfazer TODOS os
#                grupos, bastando UMA tag de cada grupo (entre as top-N tags)
#   exclusao:    atributo (mapeado para tags em `atributos`), títulos exatos,
#                padrão no nome (`padrao_titulo`) e/ou desenvolvedora
#
# Os nomes das tags seguem o vocabulário de tags de usuário da Steam (em
# inglês). 

atributos:
  pixel_art:          {rotulo: "pixel art",                tags: ["Pixel Graphics"]}
  anime:              {rotulo: "estilo anime",             tags: ["Anime"]}
  primeira_pessoa:    {rotulo: "primeira pessoa",          tags: ["First-Person"]}
  terceira_pessoa:    {rotulo: "terceira pessoa",          tags: ["Third Person"]}
  realista:           {rotulo: "gráficos realistas",       tags: ["Realistic"]}
  voxel:              {rotulo: "voxel/blocos",             tags: ["Voxel"]}
  cartunesco:         {rotulo: "visual cartunesco",        tags: ["Cartoony", "Cartoon"]}
  dois_d:             {rotulo: "2D",                       tags: ["2D"]}
  dificil:            {rotulo: "difícil",                  tags: ["Difficult"]}
  dificil_plataforma: {rotulo: "difícil (plataforma)",     tags: ["Difficult", "Precision Platformer"]}
  soulslike:          {rotulo: "soulslike",                tags: ["Souls-like"]}
  permadeath:         {rotulo: "morte permanente",         tags: ["Perma Death"]}
  multiplayer:        {rotulo: "multiplayer",              tags: ["Multiplayer", "Massively Multiplayer", "Online Co-Op", "Co-op", "PvP", "Local Multiplayer", "Local Co-Op", "Split Screen", "4 Player Local"]}
  pvp:                {rotulo: "PvP/competitivo",          tags: ["PvP", "Competitive", "Battle Royale", "e-sports"]}
  turnos:             {rotulo: "por turnos",               tags: ["Turn-Based", "Turn-Based Combat", "Turn-Based Strategy", "Turn-Based Tactics"]}
  tempo_real:         {rotulo: "tempo real",               tags: ["RTS", "Real-Time", "Real Time Tactics", "Real-Time with Pause"]}
  mundo_aberto:       {rotulo: "mundo aberto",             tags: ["Open World"]}
  roguelike:          {rotulo: "roguelike",                tags: ["Rogue-like", "Rogue-lite", "Action Roguelike", "Traditional Roguelike", "Roguelike Deckbuilder"]}
  acesso_antecipado:  {rotulo: "acesso antecipado",        tags: ["Early Access"]}
  free_to_play:       {rotulo: "free to play",             tags: ["Free to Play"]}
  crafting:           {rotulo: "crafting",                 tags: ["Crafting"]}
  terror:             {rotulo: "terror",                   tags: ["Horror", "Survival Horror", "Psychological Horror"]}
  scifi:              {rotulo: "ficção científica",        tags: ["Sci-fi", "Cyberpunk", "Space"]}
  guerra:             {rotulo: "guerra/militar",           tags: ["War", "Military", "World War II", "World War I", "Cold War"]}
  zumbis:             {rotulo: "zumbis",                   tags: ["Zombies"]}
  medieval:           {rotulo: "medieval",                 tags: ["Medieval"]}
  gore:               {rotulo: "gore/violência",           tags: ["Gore", "Violent", "Blood"]}
  terror_psicologico: {rotulo: "terror psicológico",       tags: ["Psychological Horror", "Psychological"]}
  espaco:             {rotulo: "espaço",                   tags: ["Space", "Space Sim"]}
  sexual:             {rotulo: "conteúdo sexual",          tags: ["Sexual Content", "Nudity", "NSFW"]}
  fofo:               {rotulo: "fofo",                     tags: ["Cute", "Wholesome", "Cozy"]}
  sobrenatural:       {rotulo: "sobrenatural",             tags: ["Supernatural", "Lovecraftian"]}

